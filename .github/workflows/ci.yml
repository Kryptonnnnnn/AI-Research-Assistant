name: CI
on:
  push: { branches: [main] }
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env: { POSTGRES_USER: ara, POSTGRES_PASSWORD: ara_ci, POSTGRES_DB: ara_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ara" --health-interval 5s --health-timeout 3s --health-retries 10
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      - run: pip install -r requirements-dev.txt
      - run: ruff check app tests migrations && ruff format --check app tests
      - run: mypy app
      - run: pytest -q                       # SQLite (includes retrieval eval + moto S3 emulator tests)
      - run: pytest -q                       # PostgreSQL + pgvector (also runs the Alembic migrations)
        env: { TEST_DATABASE_URL: "postgresql+asyncpg://ara:ara_ci@localhost:5432/ara_test" }
      - run: pip-audit -r requirements.txt

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run lint && npm run typecheck && npm test && npm run build
      - run: npm audit --omit=dev --audit-level=high      # what ships to users: blocking
      - run: npm audit --audit-level=high || true         # dev tooling (shadcn CLI, eslint plugins): reported, non-blocking

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: python -m venv backend/.venv && backend/.venv/bin/pip install -r backend/requirements-dev.txt
      - run: npm ci && npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
