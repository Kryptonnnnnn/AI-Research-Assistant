# Render Blueprint for the API. Verified constraints (render.com/docs/free, checked 2026-10):
#  - free web services spin down after 15 min idle (~1 min cold start), have an EPHEMERAL disk, and 750 instance-hours/month
#  - background workers are NOT available on the free plan -> JOB_RUNNER=embedded runs the worker inside the API process
#  - free Postgres expires after 30 days -> use Neon (pgvector, free) for the database instead
# Free-plan RAM is 512 MB / 0.1 CPU (render.com/docs/compute-plans). The image ships fastembed (ONNX) with the MiniLM model baked in:
# measured ~290 MB steady state for the model + ~150 MB for the API, so it is TIGHT; see docs/RETRIEVAL_EVAL.md for measurements and
# docs/DEPLOYMENT.md for what to do if the instance is OOM-killed (fall back to EMBEDDING_PROVIDER=hash, clearly labelled lexical).
services:
  - type: web
    name: ai-research-assistant-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - { key: APP_ENV, value: production }
      - { key: SECRET_KEY, generateValue: true }
      - { key: COOKIE_SECURE, value: "true" }
      - { key: CORS_ORIGINS, sync: false }          # your Vercel URL, e.g. https://your-app.vercel.app
      - { key: DATABASE_URL, sync: false }          # Neon connection string
      - { key: JOB_RUNNER, value: embedded }
      - { key: STORAGE_BACKEND, value: db }         # files in Postgres (no extra service). Switch to s3 + S3_* vars for larger libraries
      - { key: S3_BUCKET, sync: false }
      - { key: S3_ENDPOINT_URL, sync: false }
      - { key: S3_ACCESS_KEY_ID, sync: false }
      - { key: S3_SECRET_ACCESS_KEY, sync: false }
      - { key: EMBEDDING_PROVIDER, value: fastembed }  # real MiniLM vectors via ONNX; model is baked into the image
      - { key: EMBEDDING_BATCH_SIZE, value: "4" }      # small batches keep peak RAM down on 512 MB
      - { key: MAX_UPLOAD_MB, value: "10" }
      - { key: LLM_PROVIDER, value: groq }
      # Verified against the LIVE Groq /models list for the project key on 2026-10-10 (listed: allam-2-7b, openai/gpt-oss-120b,
      # openai/gpt-oss-20b, qwen/qwen3.8-27b). NOTE: llama-3.3-70b-versatile appeared on docs.groq.com but was NOT in the live list.
      # Always re-check with Settings -> Test connection / Refresh models; Groq retires models.
      - { key: LLM_MODEL, value: openai/gpt-oss-120b }
      - { key: GROQ_REASONING_EFFORT, value: low }      # gpt-oss are reasoning models; keeps token budget for the visible answer
      - { key: LLM_MAX_OUTPUT_TOKENS, value: "2500" }
      - { key: GROQ_API_KEY, sync: false }
      - { key: ALLOW_MOCK_PROVIDER, value: "false" }
